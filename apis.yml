name: Simplifeye
description: >-
  Simplifeye is a dental practice management platform that helps practices grow
  and streamline front-office operations through integrated payments, online
  scheduling, live webchat, and patient-engagement campaigns. Its HIPAA-compliant
  payments product supports in-office transactions, invoicing, and customizable
  payment plans; its 24/7 real-time online scheduler lets patients self-book
  appointments; and its live webchat is staffed by real people who answer patient
  questions and qualify leads outside business hours. Simplifeye was acquired by
  Vyne Dental and integrates with the Vyne Trellis billing platform for claims,
  eligibility, and revenue acceleration. Simplifeye operates a private,
  authenticated backend (api.simplifeye.co) that powers its dashboard and
  patient-facing widgets, but publishes no public developer program, OpenAPI
  definition, SDKs, or API documentation at this time.
